domains:
  campaign: {title: 战役与关卡域配置, desc: 章节、关卡、地图（手工锚点遗留结构）、波次时间轴与全局刷怪的配置契约}
  weapon: {title: 武器域配置, desc: 武器配置 SO（基类与子类参数接口）的配置契约}
  equipment: {title: 装备域配置, desc: 装备基础/培养、装备掉落、词条池、套装、神话词条、合成与角标评分的配置契约}
  shop: {title: 商店与抽取域配置, desc: 抽取全局、卡池、每日商店与广告补给的配置契约}
  player: {title: 角色与输入域配置, desc: 玩家（PlayerData）、角色（ModeljiData）与摇杆输入的配置契约}
  combat: {title: 战斗实体域配置, desc: 敌人、全局战斗、宝石与异常状态的配置契约}
  skill: {title: 技能与局内成长域配置, desc: 经验曲线、技能分解经验、羁绊、技能稀有度、技能池与合成配方的配置契约}
  map-scene: {title: 地图与场景元素域配置, desc: 地图生成参数、障碍物、道具、宝箱、祭坛、缓存信标、随机机关、障碍机关参数、机关文案与场景奖励池的配置契约}
  meta-progression: {title: 局外成长与结算域配置, desc: 结算参数、成长投资、成长重置规则与训练师等级的配置契约}

