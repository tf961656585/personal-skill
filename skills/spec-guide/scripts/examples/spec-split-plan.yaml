temporal_replacements:
  - old: "**实现状态**：SkillPoolData 类型已落地（`Scripts/Data/SkillPoolData.cs`），但 LevelData 代码层暂未放入此字段，待技能系统运行时逻辑接入时统一补入（避免字段悬空）"
    new: "SkillPoolData SO 契约见技能池配置表详细契约"
  - old: "> **边界语义修订（2026-09-08，无限地图）**：战场随机化立项后本作默认战场为**无限地图**——MapBounds 硬边界语义废除，玩家位置 clamp 与相机视野 clamp 不再消费地图矩形（修订见 [map.md](map.md) MapBounds 边界语义修订）。本节数据契约降级为**手工锚点承载物的遗留结构**（承载出生点与初始锚点元素）；地图生成参数改由下方「地图生成参数配置表详细契约」承载。以下原契约存档，仅当未来引入有限边界地图时恢复。"
    new: "> **边界语义修订（无限地图）**：战场随机化立项后本作默认战场为**无限地图**——MapBounds 硬边界语义废除，玩家位置 clamp 与相机视野 clamp 不再消费地图矩形（修订口径见 [map.md](map.md) MapBounds 边界语义修订）。本节契约降级为**手工锚点承载物的遗留结构**（承载出生点与初始锚点元素）；地图生成参数由本文件「地图生成参数配置表详细契约」承载。以下原契约存档，仅当未来引入有限边界地图时恢复。"

