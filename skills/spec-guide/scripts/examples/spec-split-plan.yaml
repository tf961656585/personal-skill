# spec-split-plan.yaml — data-config.md 拆分实战计划（2026-09-12，spec_splitter.py 的输入格式示例）
#
# 用法（仓库根执行）：
#   python3 ~/.agents/skills/spec-guide/scripts/spec_splitter.py split  --plan 本文件 --root .
#   python3 ~/.agents/skills/spec-guide/scripts/spec_splitter.py values --plan 本文件 --root .
#   python3 ~/.agents/skills/spec-guide/scripts/spec_splitter.py inbound --plan 本文件 --root .
#   python3 ~/.agents/skills/spec-guide/scripts/spec_splitter.py check --root Assets/docs --extra web/AGENTS.md
#
# 口径：主索引文件（配置表清单 + 核心契约）属设计工作，手写，不在脚本职责内。

